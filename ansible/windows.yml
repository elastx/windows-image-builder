---
- hosts: all
  tasks:
    # Workaround for windows 2025 images to remove WinRE partition which has to be present during installation
    - name: Get disk physical_disk and partition facts on the target
      community.windows.win_disk_facts:
        filter:
          - partitions

    - name: Print partition table
      ansible.builtin.debug:
        var: ansible_facts.disks[0].partitions

    - name: Disable WinRE for 2025 servers
      ansible.windows.win_command:
        cmd: reagentc /disable
      ignore_errors: true
      when: '"2025" in ansible_distribution' 

    - name: Remove WinRE partition if it exists (always last)
      community.windows.win_partition:
        disk_number: 0
        partition_number: "{{ ansible_facts.disks[0].partitions | length }}"
        state: absent
      when: '"2025" in ansible_distribution' 

    - name: Download CloudbaseInit setup file
      ansible.windows.win_get_url:
        url: https://cloudbase.it/downloads/CloudbaseInitSetup_1_1_6_x64.msi
        dest: C:\CloudbaseInitSetup_1_1_6_x64.msi

    - name: Install CloudbaseInit
      ansible.windows.win_package:
        path: C:\CloudbaseInitSetup_1_1_6_x64.msi
        arguments:
          - /qn

    - name: Wait 300 seconds, but only start checking after 60 seconds
      ansible.builtin.wait_for_connection:
        delay: 60
        timeout: 300

    - name: Remove CloudbaseInit setup file
      ansible.windows.win_file:
        path: C:\CloudbaseInitSetup_1_1_6_x64.msi
        state: absent

    - name: Install windows updates
      ansible.windows.win_updates:
        category_names: '*'
        reject_list:
          - KB5034439  # This update requires a recovery partition which we don't have (https://support.microsoft.com/en-us/topic/kb5034439-windows-recovery-environment-update-for-windows-server-2022-january-9-2024-6f9d26e6-784c-4503-a3c6-0beedda443ca)
          - KB5060842  # This update can cause bsod in certain conditions
        reboot: yes
        reboot_timeout: 600
      register: windows_updates
      until: windows_updates.installed_update_count == 0
      retries: 10

    # There is no working activation trigger in the deployed image on first
    # boot: the built-in KMS client cycle retries every 2 hours, so machines
    # that come up before the network/KMS/DNS is fully reachable stay
    # unactivated until someone logs on and runs slmgr /ato manually. The
    # boot task below runs the exact same command at every boot with retries.
    # It is registered after the last reboot of the build so the boot trigger
    # only ever fires on deployed machines, and it survives sysprep /generalize
    # (unlike the activation state itself).
    - name: Register boot task that activates the Windows license
      community.windows.win_scheduled_task:
        name: Activate-Windows
        description: >-
          Attempts Windows license activation (slmgr.vbs /ato) at every boot with
          retries. Deployed machines can boot before the network/KMS is reachable
          and the built-in activation cycle only retries every 2 hours.
        actions:
          - path: 'C:\Windows\System32\cscript.exe'
            arguments: '/b C:\Windows\System32\slmgr.vbs /ato'
        triggers:
          - type: boot
            delay: PT10M
        username: SYSTEM
        logon_type: service_account
        run_level: highest
        state: present
        enabled: true
        restart_count: 6
        restart_interval: PT15M
        execution_time_limit: PT10M
        multiple_instances: 2
